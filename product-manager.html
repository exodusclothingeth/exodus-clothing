<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXODUS - Product Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000; color: #fff; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: #222; border: none; padding: 10px 20px; color: #fff; cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: #fff; color: #000; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .form-card, .products-card, .hero-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; }
        button { background: #fff; color: #000; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        .sizes-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .size-checkbox { background: #1a1a1a; padding: 8px 15px; border-radius: 30px; cursor: pointer; border: 1px solid #333; }
        .size-checkbox.selected { background: #fff; color: #000; }
        .stock-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
        .stock-item { background: #1a1a1a; padding: 8px; border-radius: 8px; }
        .stock-item input { width: 100%; padding: 5px; margin-top: 5px; }
        .stock-bars { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .stock-bar-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .stock-name { width: 140px; font-size: 0.85rem; font-weight: 500; }
        .stock-bar-container { flex: 1; background: #1a1a1a; border-radius: 20px; height: 35px; overflow: hidden; }
        .stock-bar-fill { height: 100%; background: linear-gradient(90deg, #fff, #aaa); border-radius: 20px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: #000; font-weight: bold; font-size: 0.75rem; }
        .stock-bar-fill.low { background: linear-gradient(90deg, #ffaa00, #ff8800); }
        .stock-bar-fill.critical { background: linear-gradient(90deg, #ff4444, #cc0000); }
        .stock-value { width: 80px; text-align: right; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        .edit-btn { background: #333; color: #fff; }
        .delete-btn { background: #ff4444; color: #fff; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #00c853; padding: 10px 20px; border-radius: 40px; opacity: 0; transition: 0.2s; z-index: 1000; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .stock-alert-box { background: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .alert-out { background: #ff444433; border-left: 4px solid #ff4444; padding: 10px; margin: 5px 0; border-radius: 8px; }
        .alert-low { background: #ffaa0044; border-left: 4px solid #ffaa00; padding: 10px; margin: 5px 0; border-radius: 8px; }
    </style>
</head>
<body>

<script>
    const isLoggedIn = sessionStorage.getItem('admin_logged_in');
    if (!isLoggedIn) window.location.href = 'verify.html';
</script>

<div class="container">
    <h1>📦 EXODUS Product Manager</h1>
    
    <div class="tabs">
        <button class="tab-btn active" data-tab="products">👕 Products</button>
        <button class="tab-btn" data-tab="stock">📊 Stock Chart</button>
        <button class="tab-btn" data-tab="hero">🖼️ Hero Images</button>
    </div>

    <!-- Products Tab -->
    <div id="productsTab" class="tab-pane active">
        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px;">
            <div class="form-card">
                <h2 id="formTitle">➕ Add New Product</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>Price (ETB)</label>
                        <input type="number" id="productPrice" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="productCategory">
                            <option value="mens">Men's</option>
                            <option value="womens">Women's</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sizes</label>
                        <div class="sizes-container" id="sizesContainer">
                            <div class="size-checkbox" data-size="S">S</div>
                            <div class="size-checkbox" data-size="M">M</div>
                            <div class="size-checkbox" data-size="L">L</div>
                            <div class="size-checkbox" data-size="XL">XL</div>
                            <div class="size-checkbox" data-size="XXL">XXL</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Stock per Size</label>
                        <div id="stockInputs" class="stock-inputs"></div>
                    </div>
                    <input type="hidden" id="editingId">
                    <button type="submit" id="submitBtn">➕ Add Product</button>
                    <button type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
                </form>
            </div>

            <div class="products-card">
                <h2>📋 Your Products</h2>
                <div id="productsList" class="loading">Loading products...</div>
            </div>
        </div>
    </div>

    <!-- Stock Chart Tab -->
    <div id="stockTab" class="tab-pane">
        <div class="form-card">
            <h2>📊 Stock Level Chart</h2>
            <div id="stockAlerts" class="stock-alert-box" style="display: none;"></div>
            <div id="stockChart" class="stock-bars">
                <div class="loading">Loading stock data...</div>
            </div>
        </div>
    </div>

    <!-- Hero Images Tab -->
    <div id="heroTab" class="tab-pane">
        <div class="hero-card">
            <h2>🖼️ Hero Images Slideshow</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="url" id="newHeroImageUrl" placeholder="Hero image URL" style="flex:1;">
                <button id="addHeroImageBtn">Add Image</button>
            </div>
            <div id="heroImagesList"></div>
            <button id="saveHeroImagesBtn">💾 Save All Hero Images</button>
        </div>
    </div>

    <a href="admin.html">← Back to Dashboard</a>
</div>

<div class="toast" id="toastMsg">Saved!</div>

<script>
    const API_BASE = window.location.origin + '/api';
    let selectedSizes = ['S', 'M', 'L', 'XL', 'XXL'];
    let editingProductId = null;
    let allProducts = [];

    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    // Size checkboxes
    document.querySelectorAll('.size-checkbox').forEach(checkbox => {
        checkbox.addEventListener('click', () => {
            const size = checkbox.dataset.size;
            if (selectedSizes.includes(size)) {
                selectedSizes = selectedSizes.filter(s => s !== size);
                checkbox.classList.remove('selected');
            } else {
                selectedSizes.push(size);
                checkbox.classList.add('selected');
            }
            renderStockInputs();
        });
        if (checkbox.dataset.size === 'S' || checkbox.dataset.size === 'M' || checkbox.dataset.size === 'L' || 
            checkbox.dataset.size === 'XL' || checkbox.dataset.size === 'XXL') {
            checkbox.classList.add('selected');
        }
    });

    function renderStockInputs() {
        const div = document.getElementById('stockInputs');
        div.innerHTML = '';
        selectedSizes.forEach(size => {
            div.innerHTML += `<div class="stock-item"><label>${size}</label><input type="number" id="stock_${size}" value="0" min="0" class="stock-input"></div>`;
        });
    }

    function getStockObject() {
        const stock = {};
        selectedSizes.forEach(size => {
            const input = document.getElementById(`stock_${size}`);
            stock[size] = input ? parseInt(input.value) || 0 : 0;
        });
        return stock;
    }

    // Load products
    async function loadProducts() {
        try {
            const res = await fetch(`${API_BASE}/products`);
            const data = await res.json();
            allProducts = data.products || data;
            const container = document.getElementById('productsList');
            
            if (!allProducts.length) {
                container.innerHTML = '<p>No products yet. Add your first product above.</p>';
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead><tr><th>Name</th><th>Price</th><th>Category</th><th>Total Stock</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${allProducts.map(p => `
                            <tr>
                                <td>${p.name}</td>
                                <td>${p.price} ETB</td>
                                <td>${p.category || 'mens'}</td>
                                <td>${Object.values(p.stock || {}).reduce((a,b)=>a+b,0)} units</td>
                                <td>
                                    <button class="edit-btn" onclick="editProduct(${p.id})">Edit</button>
                                    <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            // Update stock chart
            renderStockChart();
            checkStockAlerts();
        } catch(err) {
            document.getElementById('productsList').innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
        }
    }

    function renderStockChart() {
        const container = document.getElementById('stockChart');
        if (!allProducts.length) {
            container.innerHTML = '<div class="loading">No products to display</div>';
            return;
        }
        
        const productsWithStock = allProducts.map(p => ({
            ...p,
            totalStock: Object.values(p.stock || {}).reduce((a,b)=>a+b,0)
        })).sort((a,b)=>a.totalStock - b.totalStock);
        
        const maxStock = Math.max(...productsWithStock.map(p=>p.totalStock), 1);
        
        container.innerHTML = productsWithStock.map(p => {
            let barClass = '';
            let icon = '';
            if (p.totalStock === 0) { barClass = 'critical'; icon = '🔴'; }
            else if (p.totalStock <= 3) { barClass = 'low'; icon = '🟡'; }
            else icon = '⚪';
            
            const widthPercent = (p.totalStock / maxStock) * 100;
            return `
                <div class="stock-bar-item">
                    <div class="stock-name">${icon} ${p.name.length > 25 ? p.name.substring(0,25)+'...' : p.name}</div>
                    <div class="stock-bar-container">
                        <div class="stock-bar-fill ${barClass}" style="width: ${widthPercent}%">
                            ${widthPercent > 15 ? p.totalStock : ''}
                        </div>
                    </div>
                    <div class="stock-value">${p.totalStock} left</div>
                </div>
            `;
        }).join('');
    }

    function checkStockAlerts() {
        const out = allProducts.filter(p => {
            const stock = p.stock || {};
            return Object.values(stock).every(q => q === 0);
        });
        const low = allProducts.filter(p => {
            const stock = p.stock || {};
            return Object.values(stock).some(q => q > 0 && q <= 3);
        });
        
        const alertDiv = document.getElementById('stockAlerts');
        if(out.length || low.length) {
            alertDiv.style.display = 'block';
            alertDiv.innerHTML = (out.length ? `<div class="alert-out"><strong>⚠️ OUT OF STOCK:</strong> ${out.map(p => p.name).join(', ')}</div>` : '') + 
                                (low.length ? `<div class="alert-low"><strong>📦 LOW STOCK (≤3 left):</strong> ${low.map(p => `${p.name} (${Object.values(p.stock).reduce((a,b)=>a+b,0)} left)`).join(', ')}</div>` : '');
        } else {
            alertDiv.style.display = 'none';
        }
    }

    async function editProduct(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;
        
        editingProductId = id;
        document.getElementById('formTitle').innerHTML = '✏️ Edit Product';
        document.getElementById('submitBtn').innerHTML = '💾 Save Changes';
        document.getElementById('cancelEditBtn').style.display = 'inline-block';
        document.getElementById('productName').value = product.name;
        document.getElementById('productPrice').value = product.price;
        document.getElementById('productCategory').value = product.category || 'mens';
        
        document.querySelectorAll('.size-checkbox').forEach(cb => cb.classList.remove('selected'));
        selectedSizes = [...(product.sizes || ['S','M','L','XL','XXL'])];
        document.querySelectorAll('.size-checkbox').forEach(cb => {
            if (selectedSizes.includes(cb.dataset.size)) cb.classList.add('selected');
        });
        renderStockInputs();
        
        setTimeout(() => {
            Object.entries(product.stock || {}).forEach(([size, qty]) => {
                const input = document.getElementById(`stock_${size}`);
                if (input) input.value = qty;
            });
        }, 50);
    }

    async function deleteProduct(id) {
        if (confirm('Delete this product?')) {
            await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE' });
            showToast('Product deleted');
            loadProducts();
        }
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const product = {
            name: document.getElementById('productName').value,
            price: parseInt(document.getElementById('productPrice').value),
            category: document.getElementById('productCategory').value,
            images: [],
            sizes: selectedSizes,
            stock: getStockObject()
        };
        
        try {
            if (editingProductId) {
                await fetch(`${API_BASE}/products/${editingProductId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });
                showToast('Product updated!');
            } else {
                await fetch(`${API_BASE}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });
                showToast('Product added!');
            }
            
            document.getElementById('productForm').reset();
            editingProductId = null;
            document.getElementById('formTitle').innerHTML = '➕ Add New Product';
            document.getElementById('submitBtn').innerHTML = '➕ Add Product';
            document.getElementById('cancelEditBtn').style.display = 'none';
            selectedSizes = ['S','M','L','XL','XXL'];
            document.querySelectorAll('.size-checkbox').forEach(cb => {
                if (['S','M','L','XL','XXL'].includes(cb.dataset.size)) cb.classList.add('selected');
                else cb.classList.remove('selected');
            });
            renderStockInputs();
            loadProducts();
        } catch(err) {
            showToast('Error: ' + err.message);
        }
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
        editingProductId = null;
        document.getElementById('productForm').reset();
        document.getElementById('formTitle').innerHTML = '➕ Add New Product';
        document.getElementById('submitBtn').innerHTML = '➕ Add Product';
        document.getElementById('cancelEditBtn').style.display = 'none';
        selectedSizes = ['S','M','L','XL','XXL'];
        document.querySelectorAll('.size-checkbox').forEach(cb => {
            if (['S','M','L','XL','XXL'].includes(cb.dataset.size)) cb.classList.add('selected');
            else cb.classList.remove('selected');
        });
        renderStockInputs();
    });

    // Hero images
    async function loadHeroImages() {
        try {
            const res = await fetch(`${API_BASE}/hero-images`);
            const data = await res.json();
            heroImagesArray = data.images || [];
            renderHeroList();
        } catch(err) {
            console.log('Hero load error:', err);
        }
    }

    let heroImagesArray = [];

    function renderHeroList() {
        const container = document.getElementById('heroImagesList');
        if (!heroImagesArray.length) {
            container.innerHTML = '<p>No hero images. Add your first image above.</p>';
            return;
        }
        container.innerHTML = heroImagesArray.map((url, i) => `
            <div style="display:flex; align-items:center; gap:10px; padding:10px; background:#1a1a1a; margin-bottom:10px; border-radius:8px;">
                <div style="width:60px;height:60px;border-radius:6px;overflow:hidden;"><img src="${url}" style="width:100%;height:100%;object-fit:cover;"></div>
                <div style="flex:1; font-size:12px; color:#888;">${url.substring(0, 60)}...</div>
                <button onclick="removeHeroImage(${i})" style="background:#ff4444; padding:5px 10px;">Remove</button>
            </div>
        `).join('');
    }

    function removeHeroImage(index) {
        heroImagesArray.splice(index, 1);
        renderHeroList();
    }

    async function saveHeroImages() {
        await fetch(`${API_BASE}/hero-images`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ images: heroImagesArray })
        });
        showToast('Hero images saved!');
    }

    document.getElementById('addHeroImageBtn')?.addEventListener('click', () => {
        const url = document.getElementById('newHeroImageUrl').value.trim();
        if (!url) { showToast('Enter an image URL'); return; }
        heroImagesArray.push(url);
        document.getElementById('newHeroImageUrl').value = '';
        renderHeroList();
        showToast('Hero image added. Click "Save All Hero Images" to save.');
    });

    document.getElementById('saveHeroImagesBtn')?.addEventListener('click', saveHeroImages);

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            if (btn.dataset.tab === 'products') {
                document.getElementById('productsTab').classList.add('active');
                loadProducts();
            } else if (btn.dataset.tab === 'stock') {
                document.getElementById('stockTab').classList.add('active');
                renderStockChart();
                checkStockAlerts();
            } else {
                document.getElementById('heroTab').classList.add('active');
                loadHeroImages();
            }
        });
    });

    renderStockInputs();
    loadProducts();
    
    window.editProduct = editProduct;
    window.deleteProduct = deleteProduct;
    window.removeHeroImage = removeHeroImage;
</script>
</body>
</html>
