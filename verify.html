<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EXODUS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: #111;
            border: 1px solid #222;
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo img { height: 70px; width: auto; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.85rem; }
        input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #fff; }
        button {
            width: 100%;
            background: white;
            color: black;
            padding: 14px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover { background: #ddd; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error {
            background: rgba(255,68,68,0.2);
            color: #ff4444;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .success {
            background: rgba(0,200,83,0.2);
            color: #00c853;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .back-link { text-align: center; margin-top: 24px; }
        .back-link a { color: #888; text-decoration: none; font-size: 0.8rem; }
        .back-link a:hover { color: white; }
        .timer-text { color: #888; font-size: 0.7rem; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="images/exodus-logo.png" alt="EXODUS" onerror="this.style.display='none'; this.nextSibling.style.display='block';">
            <span style="display: none; font-size: 1.8rem; font-weight: 800;">EXODUS</span>
        </div>
        <h1>Admin Access</h1>
        <p class="subtitle">Enter your email to receive a verification code</p>
        
        <div id="emailForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="exodusclothingeth@gmail.com">
            </div>
            <button id="sendCodeBtn">Send Verification Code →</button>
        </div>
        
        <div id="codeForm" style="display: none;">
            <div class="form-group">
                <label>Verification Code</label>
                <input type="text" id="code" placeholder="Enter 6-digit code" maxlength="6">
            </div>
            <button id="verifyBtn">Verify & Login →</button>
            <div class="timer-text" id="timerText"></div>
        </div>
        
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        
        <div class="back-link">
            <a href="index.html">← Back to Store</a>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let countdownInterval = null;
        
        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError('Please enter your email address');
                return;
            }
            
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Sending...';
            
            try {
                const response = await fetch('/api/send-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentEmail = email;
                    showSuccess('✅ Verification code sent! Check your email (or server console).');
                    document.getElementById('emailForm').style.display = 'none';
                    document.getElementById('codeForm').style.display = 'block';
                    startCountdown(600); // 10 minutes
                } else {
                    showError(result.error || 'Failed to send code');
                    btn.disabled = false;
                    btn.innerHTML = 'Send Verification Code →';
                }
            } catch (err) {
                showError('Connection error. Please try again.');
                btn.disabled = false;
                btn.innerHTML = 'Send Verification Code →';
            }
        });
        
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const code = document.getElementById('code').value.trim();
            if (!code || code.length !== 6) {
                showError('Please enter the 6-digit verification code');
                return;
            }
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Verifying...';
            
            try {
                const response = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, code })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    sessionStorage.setItem('admin_logged_in', 'true');
                    sessionStorage.setItem('admin_email', currentEmail);
                    window.location.href = 'admin.html';
                } else {
                    showError(result.error || 'Invalid verification code');
                    btn.disabled = false;
                    btn.innerHTML = 'Verify & Login →';
                }
            } catch (err) {
                showError('Verification failed. Please try again.');
                btn.disabled = false;
                btn.innerHTML = 'Verify & Login →';
            }
        });
        
        function startCountdown(seconds) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            const timerText = document.getElementById('timerText');
            let remaining = seconds;
            
            countdownInterval = setInterval(() => {
                const minutes = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerText.textContent = `Code expires in: ${minutes}:${secs.toString().padStart(2, '0')}`;
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timerText.textContent = 'Code expired. Please request a new code.';
                    document.getElementById('verifyBtn').disabled = true;
                }
                remaining--;
            }, 1000);
        }
        
        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
        }
        
        function showSuccess(msg) {
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            setTimeout(() => { successDiv.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
